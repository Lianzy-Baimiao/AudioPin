[package]
name = "audiopin"
version = "0.1.4"
edition = "2021"
description = "Native Windows microphone and AMD Noise Suppression guardian"
license = "MIT"
repository = "https://github.com/Lianzy-Baimiao/AudioPin"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
winreg = "0.56"
sha2 = "0.10"
semver = "1"
ureq = { version = "3", features = ["json"] }
windows = { version = "0.62", features = ["Win32_Media_Audio", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_WinRT"] }
windows-sys = { version = "0.61", features = [
  "Win32_Foundation", "Win32_Security", "Win32_System_Threading",
  "Win32_System_Memory", "Win32_System_LibraryLoader", "Win32_System_Diagnostics_ToolHelp", "Win32_System_RemoteDesktop",
  "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls", "Win32_UI_HiDpi",
  "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_System_SystemInformation",
  "Win32_Storage_FileSystem", "Win32_UI_Input_KeyboardAndMouse"
] }

[build-dependencies]
embed-resource = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
