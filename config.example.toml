# Copy settings via the UI, or edit %LOCALAPPDATA%\AudioPin\config.toml then reload.
# Device IDs are machine-specific. Select actual devices in the UI.
# When Windows recreates an endpoint under a new ID (e.g. during a Windows Update
# restart), it records the replaced ID; AudioPin follows only that record and
# saves the new ID.
# The *_name fields are display names kept for a device Windows no longer lists.
schema_version = 1
guard_enabled = true
amd_enabled = true
physical_input = ""
physical_input_name = ""
output_input = ""
output_input_name = ""
pin_default = false
pin_communications = false
poll_seconds = 2
retry_max_seconds = 60
notifications = true
notification_cooldown_seconds = 10
autostart = false
start_minimized = true
close_to_tray = true
restart_amd_if_missing = true
# Restart the verified Radeon control panel after recovery to reload its cache.
# Also performs one initial synchronization. Radeon windows may close and reopen.
reload_amd_panel = true
# Experimental Windows per-process input preference, not app-specific integration.
# Populate with actual process filenames only when testing compatibility.
apps = []
pin_apps = false
update_repository = "Lianzy-Baimiao/AudioPin"
auto_check_updates = false
use_gh_auth = true
